[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  ".agent",
  ".eval-artifacts",
  ".public-check",
  ".public-repo",
  ".tmp",
  "_bmad",
  "_bmad-output",
  "backend/venv",
  "frontend/node_modules",
  "scratch",
  "tmp",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
